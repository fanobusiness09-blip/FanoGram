workflows:
  fanogram-apk:
    name: Build FanoGram APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          sdkmanager --install "ndk;25.1.8937393" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties
          chmod +x ./gradlew
          ./gradlew assembleAfatDebug
    artifacts:
      - TMessagesProj/build/outputs/apk/afat/debug/*.apk
