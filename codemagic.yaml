workflows:
  fanogram-apk:
    name: Build FanoGram APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
      android_signing:
        - keystore_reference
      groups:
        - android
      vars:
        PACKAGE_NAME: "com.fanogram.messenger"
    scripts:
      - name: Install NDK
        script: |
          sdkmanager --install "ndk;25.1.8937393"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties
      - name: Build APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleAfatDebug --no-daemon
    artifacts:
      - TMessagesProj/build/outputs/apk/afat/debug/*.apk
