workflows:
  fanogram-apk:
    name: Build FanoGram APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - keystore_reference
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleAfatDebug
    artifacts:
      - TMessagesProj/build/outputs/apk/afat/debug/*.apk
