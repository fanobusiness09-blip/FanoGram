name: Build FanoGram APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android dependencies
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"

          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2"

          test -d "$SDK_ROOT/ndk/21.4.7075529"

          printf 'sdk.dir=%s\nndk.dir=%s/ndk/21.4.7075529\n' \
            "$SDK_ROOT" "$SDK_ROOT" > local.properties

      - name: Build FanoGram APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleAfatDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FanoGram-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 7
